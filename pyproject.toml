[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LMuny", email = "ludovic.muny@gmail.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    'vllm==0.10.1',
    'pydantic'
]

[project.scripts]
src = "src:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]
